[project]
name = "better-youtube-search"
version = "0.1.0"
description = "Search your YouTube subscriptions by topic, using channel and recent video metadata."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "fastembed>=0.4.0",
    "numpy>=1.26",
    # Intel Macs: onnxruntime stopped shipping x86_64 macOS wheels after 1.23.2.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bys = "bys.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
